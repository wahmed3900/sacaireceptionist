<form id="demo-form" action="/demo-request" method="post" novalidate>

<script>
(function () {
var form = document.getElementById('demo-form');
var msg = document.getElementById('form-msg');
var btn = form.querySelector('button[type=submit]');
var label = 'Request my free trial';

function show(type, text) { msg.className = 'msg ' + type; msg.textContent = text; }

if (location.search.indexOf('sent=1') !== -1) show('ok', "Request sent. I'll reach out within one business day.");

form.addEventListener('submit', function (e) {
e.preventDefault();
var data = new FormData(form);
var missing = [];
if (!String(data.get('name')).trim()) missing.push('your name');
if (!String(data.get('business')).trim()) missing.push('business name');
if (String(data.get('phone')).replace(/\D/g, '').length < 10) missing.push('a 10-digit phone number');
if (!data.get('trade')) missing.push('your business type');
if (!data.get('smsConsent')) missing.push('SMS consent (the checkbox above)');
if (missing.length) { show('err', 'Please provide ' + missing.join(', ') + '.'); return; }

btn.disabled = true; btn.textContent = 'Sending...';
fetch('/demo-request', {
method: 'POST',
headers: { 'Accept': 'application/json' },
body: new URLSearchParams(data)
})
.then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
.then(function (res) {
if (res.ok) { form.reset(); show('ok', "Request sent. I'll reach out within one business day."); }
else show('err', res.body.error || 'The request did not go through. Try again in a minute.');
})
.catch(function () { show('err', 'Could not reach the server. Check your connection and try again.'); })
.then(function () { btn.disabled = false; btn.textContent = label; });
});
})();
</script>
